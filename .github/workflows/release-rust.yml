name: release-rust

# Build, lint and test the Rust implementation on every push/PR touching it;
# publish a GitHub release with Linux binaries when a tag `rust-vX.Y.Z` is pushed.
on:
  push:
    branches: [main]
    tags: ["rust-v*"]
    paths: ["driver/rust/**", "packaging/**", ".github/workflows/release-rust.yml"]
  pull_request:
    paths: ["driver/rust/**", "packaging/**", ".github/workflows/release-rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # ARM64 runners are free for public repositories only.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: driver/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: driver/rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        id: pkg
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          name="hsm01-rust-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/hsm01 "dist/$name/"
          cp ../../packaging/udev/70-hercules-stream100.rules "dist/$name/"
          cp ../../docs/driver/rust.md "dist/$name/README.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            driver/rust/dist/*.tar.gz
            driver/rust/dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: hsm01 Rust ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
