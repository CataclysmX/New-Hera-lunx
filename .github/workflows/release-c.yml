name: release-c

# Build and test the C implementation on every push/PR touching it;
# publish a GitHub release with Linux binaries + static libs when a tag `c-vX.Y.Z` is pushed.
on:
  push:
    branches: [main]
    tags: ["c-v*"]
    paths: ["driver/c/**", "packaging/**", ".github/workflows/release-c.yml"]
  pull_request:
    paths: ["driver/c/**", "packaging/**", ".github/workflows/release-c.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64, cc: gcc, package: true }
          - { os: ubuntu-24.04, arch: x86_64, cc: clang, package: false }
          # ARM64 runners are free for public repositories only.
          - { os: ubuntu-24.04-arm, arch: aarch64, cc: gcc, package: true }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libusb-1.0-0-dev libpng-dev libjpeg-dev libgif-dev ${{ matrix.cc }}

      - name: Configure
        run: cmake -S driver/c -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHSM01_WERROR=ON -DHSM01_REQUIRE_IMAGE_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: matrix.package
        id: pkg
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#c-v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          name="hsm01-c-${version}-linux-${{ matrix.arch }}"
          DESTDIR="$PWD/dist/$name" cmake --install build
          cp packaging/udev/70-hercules-stream100.rules "dist/$name/"
          cp docs/driver/c.md "dist/$name/README.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: matrix.package
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/c-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: hsm01 C ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
