"Dashboard of a racing game in the format SimHub reads: the \"SimHub compatible\" stream (Forza Data Out, UDP, port 8888) the game sends (Motor Town, Forza…), or the SimHub program itself. Rpm, gear, speed, pedals, fuel, tyres, race, LEDs as a rev counter. Same dashboard as the Motor Town module." = "Tableau de bord d'un jeu de course au format que lit SimHub : le flux « compatible SimHub » (Forza Data Out, UDP, port 8888) que le jeu envoie (Motor Town, Forza…), ou le programme SimHub lui-même. Régime, rapport, vitesse, pédales, carburant, pneus, course, LEDs en compte-tours. Même tableau que le module Motor Town."
