"By default, the module itself receives what the game would send to SimHub: in the game, \"SimHub compatible\" or \"Forza Data Out\" telemetry output, address 127.0.0.1 (this computer), port 8888 (Motor Town: Options > Gameplay, Forza-compatible format). No need for the SimHub program." = "Par défaut, le module reçoit lui-même ce que le jeu enverrait à SimHub : dans le jeu, sortie de télémétrie « compatible SimHub » ou « Forza Data Out », adresse 127.0.0.1 (cet ordinateur), port 8888 (Motor Town : Options > Gameplay, format Forza-compatible). Pas besoin du programme SimHub."
