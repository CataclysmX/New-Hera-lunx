"0.0.0.0: the game on this computer or another one of the network; 127.0.0.1: this computer only; or an address of this PC. In the game: 127.0.0.1, or the address of this PC on the network (shown on the waiting page)." = "0.0.0.0 : le jeu sur cet ordinateur ou un autre du réseau ; 127.0.0.1 : cet ordinateur seulement ; ou une adresse de ce PC. Dans le jeu : 127.0.0.1, ou l'adresse de ce PC sur le réseau (affichée sur la page en attente)."
