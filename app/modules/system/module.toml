# Module livré avec new hera-nux (docs/app/modules.md) : à modifier librement ici ;
# « Réinstaller les modules livrés » remet la version d'origine.
name = "System"
description = "\"System\" page (processor, memory, temperatures, disks, batteries of the devices) and alerts: temperature held above a limit, disk almost full, low battery. Settings (sensors, limits, durations, alert style): \"System\" tab of the window. Options: --no-page, --show."
file = "main.py"
args = []

# Onglet « Système » de la fenêtre (module activé) : un formulaire (champs ci-dessous) sur
# systeme.toml ; la liste des sondes vient du module lancé (celles de la machine).
[settings]
file = "systeme.toml"
editor = "formulaire"
guide = """
A temperature alert goes off when the sensor stays above the limit for the chosen time (short peaks are ignored), then only again once it has gone back down by the rearm gap.
"auto" sensor: Tctl (AMD) or Package id 0 (Intel) for the processor; edge for an AMD card (junction, the hottest point of the chip, normally reaches 90-105 °C in games), nvidia-smi for NVIDIA; Composite for the SSD.
"""

[[settings.field]]
kind = "section"
label = "Page"

[[settings.field]]
key = "page.afficher"
label = "\"System\" page"
kind = "bool"
default = true
help = "Unchecked: alerts only (lines of the page: key lignes of systeme.toml)."

[[settings.field]]
kind = "section"
label = "Alerts"

[[settings.field]]
key = "alertes.style"
label = "Style"
kind = "choice"
choices = ["carte", "pilule"]
choice_labels = ["card", "pill"]
default = "carte"
help = "card: at the top with an icon; pill: short band at the bottom"

[[settings.field]]
key = "alertes.duree"
label = "Time on screen"
kind = "number"
min = 2
max = 60
unit = "s"
default = 10

[[settings.field]]
key = "alertes.led"
label = "Blinking LED"
kind = "number"
min = 0
max = 4
default = 4
help = "1 to 4; 0: none"

[[settings.field]]
key = "alertes.reveil"
label = "Turn the screen on from standby"
kind = "bool"
default = true

[[settings.field]]
kind = "section"
label = "Processor"

[[settings.field]]
key = "alertes.processeur.actif"
label = "Alert"
kind = "bool"
default = true

[[settings.field]]
key = "alertes.processeur.sonde"
label = "Sensor"
kind = "choice"
source = "sondes"
default = "auto"

[[settings.field]]
key = "alertes.processeur.seuil"
label = "Limit"
kind = "number"
min = 40
max = 110
unit = "°C"
default = 90

[[settings.field]]
key = "alertes.processeur.pendant"
label = "Held above for"
kind = "number"
min = 0
max = 600
unit = "s"
default = 20

[[settings.field]]
key = "alertes.processeur.retour"
label = "Rearmed below the limit by"
kind = "number"
min = 1
max = 30
unit = "°C"
default = 5

[[settings.field]]
key = "alertes.processeur.rappel"
label = "Reminder if it lasts"
kind = "number"
min = 0
max = 120
unit = "min"
default = 0
help = "0: a single alert"

[[settings.field]]
kind = "section"
label = "Graphics card"

[[settings.field]]
key = "alertes.gpu.actif"
label = "Alert"
kind = "bool"
default = true

[[settings.field]]
key = "alertes.gpu.sonde"
label = "Sensor"
kind = "choice"
source = "sondes"
default = "auto"

[[settings.field]]
key = "alertes.gpu.seuil"
label = "Limit"
kind = "number"
min = 40
max = 120
unit = "°C"
default = 90

[[settings.field]]
key = "alertes.gpu.pendant"
label = "Held above for"
kind = "number"
min = 0
max = 600
unit = "s"
default = 20

[[settings.field]]
key = "alertes.gpu.retour"
label = "Rearmed below the limit by"
kind = "number"
min = 1
max = 30
unit = "°C"
default = 5

[[settings.field]]
key = "alertes.gpu.rappel"
label = "Reminder if it lasts"
kind = "number"
min = 0
max = 120
unit = "min"
default = 0
help = "0: a single alert"

[[settings.field]]
kind = "section"
label = "SSD"

[[settings.field]]
key = "alertes.ssd.actif"
label = "Alert"
kind = "bool"
default = true

[[settings.field]]
key = "alertes.ssd.sonde"
label = "Sensor"
kind = "choice"
source = "sondes"
default = "auto"

[[settings.field]]
key = "alertes.ssd.seuil"
label = "Limit"
kind = "number"
min = 40
max = 100
unit = "°C"
default = 75

[[settings.field]]
key = "alertes.ssd.pendant"
label = "Held above for"
kind = "number"
min = 0
max = 600
unit = "s"
default = 60

[[settings.field]]
kind = "section"
label = "Disks and batteries"

[[settings.field]]
key = "alertes.disque.actif"
label = "Disk almost full alert"
kind = "bool"
default = true

[[settings.field]]
key = "alertes.disque.seuil"
label = "From"
kind = "number"
min = 50
max = 100
unit = "% used"
default = 95

[[settings.field]]
key = "alertes.batterie.actif"
label = "Low battery alert"
kind = "bool"
default = true

[[settings.field]]
key = "alertes.batterie.seuil"
label = "Below"
kind = "number"
min = 1
max = 50
unit = "%"
default = 15
