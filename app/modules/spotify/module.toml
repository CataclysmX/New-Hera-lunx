[[settings.field]]
kind = "section"
label = "Advanced"

[[settings.field]]
key = "redirection"
label = "Redirect address"
kind = "text"
default = "http://127.0.0.1:8888/callback"
help = "The one declared in the Spotify dashboard (Redirect URIs), exactly the same; the port must be free."

# Données sensibles : saisies dans l'onglet, gardées dans .env (lisible par vous seul).
[[secret]]
name = "SPOTIFY_CLIENT_ID"
label = "Client ID"
description = "developer.spotify.com/dashboard → your application → Settings → Client ID"

[[secret]]
name = "SPOTIFY_CLIENT_SECRET"
label = "Client secret"
description = "Settings → \"View client secret\": share it with no one"
hidden = true
