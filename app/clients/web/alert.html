<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerte Stream 100</title>
<style>
  :root { color-scheme: light dark; --accent: #00b4a8; }
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; }
  label { display: block; margin-top: .8rem; }
  input { width: 100%; box-sizing: border-box; padding: .4rem; font: inherit; }
  button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; cursor: pointer; }
  pre { background: rgba(127,127,127,.12); padding: .6rem; border-radius: 6px; min-height: 6rem;
        white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Alerte sur le Stream 100</h1>
<p>Exemple de l'API ouverte de new hera-nux par WebSocket. Collez l'adresse donnée par la
fenêtre de l'app (onglet Appareil → API ouverte → « Copier l'adresse WebSocket »).</p>

<label>Adresse <input id="url" placeholder="ws://127.0.0.1:9137/?token=…"></label>
<label>Titre <input id="title" value="Bonjour"></label>
<label>Texte <input id="text" value="Envoyée depuis une page web"></label>
<label>Icône (nom du thème) <input id="icon" value="dialog-information"></label>
<button id="send">Envoyer</button>
<pre id="log"></pre>

<script>
const $ = (id) => document.getElementById(id);
const log = (line) => { $('log').textContent += line + '\n'; };
let ws = null;
let next = 1;

function connect(url) {
  return new Promise((resolve, reject) => {
    const s = new WebSocket(url);
    s.onopen = () => {
      s.send(JSON.stringify({ type: 'hello', name: 'web-alert' }));
      resolve(s);
    };
    s.onerror = () => reject(new Error('connexion refusée (adresse ou jeton ?)'));
    s.onclose = () => { log('déconnecté'); ws = null; };
    s.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === 'welcome') log(`connecté à ${msg.app}, firmware ${msg.firmware}`);
      else if (msg.event === 'alert_closed') log(`alerte ${msg.id} fermée : ${msg.reason}`);
      else if (msg.type === 'error') log(`erreur : ${msg.message}`);
      else if (msg.type === 'ok' && msg.id) log(`alerte ${msg.id} affichée`);
    };
  });
}

$('send').onclick = async () => {
  try {
    if (!ws) ws = await connect($('url').value.trim());
    ws.send(JSON.stringify({
      type: 'alert', req: next++,
      title: $('title').value, text: $('text').value, icon: $('icon').value,
      led: 1, duration: 8,
    }));
  } catch (e) {
    log(e.message);
  }
};
</script>
</body>
</html>
